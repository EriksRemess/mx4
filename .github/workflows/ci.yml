name: Rust checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }} / Rust ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            toolchain: stable
          - os: ubuntu-22.04
            toolchain: '1.100.0'
          - os: macos-latest
            toolchain: stable

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install native build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config libudev-dev

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "${{ matrix.toolchain }}" --profile minimal --component clippy --component rustfmt --no-self-update
          rustup default "${{ matrix.toolchain }}"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --locked

      - name: Check documentation and examples
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo test --doc --locked
          cargo doc --no-deps --locked
